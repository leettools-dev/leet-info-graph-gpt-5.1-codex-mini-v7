version: "3.9"
services:
  backend:
    image: python:3.12-slim
    container_name: ris-backend
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python", "-m", "http.server", "8000"]
    ports:
      - "8000:8000"
  frontend:
    image: node:20-slim
    container_name: ris-frontend
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python", "-m", "http.server", "3000"]
    ports:
      - "3000:3000"
